# Planwerk — Convention-Based Project Config
#
# This file is read by Planwerk's gate engine and orchestrator to determine
# how to validate, build, and quality-check sessions working on this project.

project:
  name: Planwerk
  description: AI-first SDLC work management system built on Agent Host Protocol

# Scripts map to quality gates and lifecycle hooks.
# Each script has a name, command, and trigger conditions.
scripts:
  - name: Install
    command: npm exec --yes --package=npm@11.13.0 -- npm ci
    triggers: [session.create]

  - name: Lint
    command: npm run lint
    triggers: [gate.build-to-review]
    gate: true

  - name: Type Check
    command: npx tsc --noEmit
    triggers: [gate.build-to-review]
    gate: true

  - name: Build
    command: npm run build
    triggers: [gate.build-to-review]
    gate: true

  - name: Test
    command: npm test
    triggers: [gate.build-to-review]
    gate: true

  - name: Dev Server
    command: npm run dev
    triggers: [session.create]
    background: true

# Use rubber-duck for general reviews and switch the same code-review gate to the
# dedicated review command for medium/high-risk implementation checks.
skills:
  plan-review:
    prompt: /rubber-duck the plan and improve it based on feedback.
    description: Adversarial plan review — challenges assumptions and gaps
    risk_threshold: low
    max_iterations: 2
    auto_fix: true

  code-review:
    prompt: >-
      /rubber-duck Review the implementation for correctness and architectural
      soundness before it enters Review. Verify that it satisfies the intent in
      plan.md and follows repository invariants. Fix implementation issues when
      possible, then report concrete blockers that remain.
    prompt_by_risk:
      medium: >-
        /review Review the implementation for correctness, regressions,
        security vulnerabilities, unsafe trust boundaries, architectural coupling,
        and scalability risks. Fix issues whenever possible, then report only
        concrete, actionable blockers that remain.
      high: >-
        /review Run 5+ parallel review agents against the implementation for correctness, regressions,
        security vulnerabilities, unsafe trust boundaries, architectural coupling,
        and scalability risks. Fix issues whenever possible, then report only
        concrete, actionable blockers that remain.
    description: Risk-adaptive implementation correctness and architecture review
    risk_threshold: low
    max_iterations: 3
    auto_fix: true

  review-report:
    prompt: >-
      Independently assess the final implementation for human review and shipping.
      Read the original plan.md, the final changes, and all available build and
      review evidence. Verify that the change works as expected, gather any missing
      review evidence, and create or update review.md beside plan.md. review.md must
      summarize the intended outcome, implemented result, validation evidence and
      prior gate signals, divergences or decision changes, unresolved risks and
      human-attention items, and a ship recommendation. Keep plan.md as the original
      high-level intent. Do not change implementation code; report blockers instead.
    description: Final intent-to-implementation review and durable human handoff
    risk_threshold: low
    max_iterations: 2
    auto_fix: true

# Review iteration and post-review plan approval policy.
# YAML-defined plan gates run in a peer chat of the owning session. Medium/high
# plans remain pending for a human by default after those gates pass.
review_policy:
  low:
    max_iterations: 1
    follow_edits: false
    auto_approve_plan: true
  medium:
    max_iterations: 2
    follow_edits: false
    auto_approve_plan: false
  high:
    max_iterations: 3
    follow_edits: true
    auto_approve_plan: false

# Gate definitions per phase transition.
# Required gates MUST pass before the orchestrator advances a card.
gates:
  define-to-plan:
    required: []
    optional: []

  plan-to-build:
    required:
      - type: review
        skill: plan-review
        description: Adversarial plan review — challenges assumptions and gaps
    optional: []

  build-to-review:
    required:
      - type: script
        name: Lint
      - type: script
        name: Type Check
      - type: script
        name: Build
      - type: script
        name: Test
      - type: review
        skill: code-review
        description: Independent implementation correctness and architecture review
    optional: []

  review-to-ship:
    required:
      - type: review
        skill: review-report
        description: Final evidence synthesis and human-review handoff
      - type: artifact
        artifact: review
        description: Readable review.md beside plan.md
    optional: []

# WIP limits per phase (orchestrator enforces these)
wip_limits:
  build: 3
  review: 2

# Board-level coherence gate (horizontal gate across concurrent sessions).
# When two in-flight cards touch overlapping code, an external reviewer judges
# whether their changes cohere or clash. Conflicts block review→ship only when a
# high-risk card is involved (pair-level); low/medium conflicts are advisory.
coherence:
  enabled: true
  module_depth: 2            # dir segments (repo-relative) compared for module-tier overlap
  block_high_risk_ship: true # hard-block ship when a high-risk card is in a conflict

# Orchestrator behavior
orchestrator:
  heartbeat_interval: 30s
  stale_threshold: 10m
  auto_nudge: true
  max_retry_on_failure: 2
