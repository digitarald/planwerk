name: Native release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Apple Silicon preview
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Check architecture and release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { releaseVersion } from "./scripts/prepare-native-release.mjs";
            const root = JSON.parse(readFileSync("package.json"));
            const desktop = JSON.parse(readFileSync("desktop/package.json"));
            releaseVersion(process.env.RELEASE_TAG, root.version, desktop.version);
          '

      - name: Install dependencies
        run: npm exec --yes --package=npm@11.13.0 -- npm ci --no-audit --fund=false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Prepare desktop toolchain
        run: |
          for attempt in 1 2 3; do
            if npm run native:setup; then
              exit 0
            fi
            echo "::warning::Desktop toolchain setup failed (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "::error::Desktop toolchain setup failed after three attempts"
          exit 1

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build unsigned app and DMG
        run: npm run native:build

      - name: Prepare versioned artifact and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/prepare-native-release.mjs "$RELEASE_TAG"
          cd "desktop/artifacts/$RELEASE_TAG"
          shasum -a 256 -c SHA256SUMS
          hdiutil verify Planwerk-*-macos-arm64.dmg

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: desktop/artifacts/${{ github.ref_name }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish native preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64
          path: release

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          cat > notes.md <<'EOF'
          ## Apple Silicon macOS preview

          Download the DMG and drag Planwerk to Applications. No separate Node or Bun installation is needed.
          VS Code with an AHP 1.0.0 endpoint and Copilot authentication are required.

          **Unsigned and not notarized.** macOS may block this experimental app.
          Proceed only if you trust the source. Use Apple's per-app Privacy & Security approval flow;
          do not disable Gatekeeper globally.

          Download SHA256SUMS beside the DMG and run `shasum -a 256 -c SHA256SUMS`.
          Checksums detect corruption, not publisher identity.

          Intel, Windows, and Linux binaries and automatic updates are not available.

          _🤖 Posted by GitHub Copilot on Harald's behalf._
          EOF
          gh release create "$RELEASE_TAG" Planwerk-*-macos-arm64.dmg SHA256SUMS \
            --verify-tag --prerelease --title "Planwerk $RELEASE_TAG" --notes-file notes.md
